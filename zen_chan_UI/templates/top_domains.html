<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Domains</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/sub_style.css">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            width: 100%;
            background-color: black;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            height: 100%;
        }
        .terminal-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .panel-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }
        #topDomainsChart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="terminal-panel">
            <div class="panel-header">
                <span class="panel-header-title">Top Domains by Visit Duration</span>
            </div>
            <div class="panel-content">
                <canvas id="topDomainsChart"></canvas>
            </div>
        </div>
    </div>
    <script>
        async function fetchAndRenderChart() {
            try {
                const response = await fetch('/api/top_domains');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const chartData = await response.json();

                const ctx = document.getElementById('topDomainsChart').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: chartData.labels,
                        datasets: [{
                            data: chartData.data,
                            backgroundColor: [
                                'rgba(51, 255, 51, 0.7)',
                                'rgba(0, 255, 255, 0.7)',
                                'rgba(255, 255, 51, 0.7)',
                                'rgba(255, 102, 255, 0.7)',
                                'rgba(255, 153, 51, 0.7)',
                                'rgba(153, 153, 153, 0.7)'
                            ],
                            borderColor: '#000',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'top',
                                labels: {
                                    color: '#33ff33'
                                }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error("Error fetching or rendering chart:", error);
            }
        }
        document.addEventListener('DOMContentLoaded', fetchAndRenderChart);
    </script>
</body>
</html>
