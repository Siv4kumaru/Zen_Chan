<!-- templates/mood_master.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Distribution by Hour</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="static/css/style.css">
    <style>    
        html, body {
            margin: 0;
            height: 100%;
            width: 100%;
            background-color: black; /* Pure black background */
            color: #33ff33;
            font-family: 'Courier New', monospace;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            height: 100%;
        }
        .terminal-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            border: 1px solid #33ff33; /* Add border for terminal effect */
            box-sizing: border-box; /* Include padding and border in the element's total width and height */
        }

        /* Terminal Panel Header Styles */
        .panel-header {
            background-color: #0a0a0a; /* Slightly lighter black for header */
            padding: 8px 15px;
            border-bottom: 1px solid #33ff33;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
            text-transform: uppercase;
        }
        .panel-header-title {
            color: #33ff33;
        }
        .panel-buttons span {
            margin-left: 10px;
            cursor: pointer;
            color: #33ff33;
        }

        /* Content area for the Chart.js graph */
        .panel-content {
            flex-grow: 1; /* Takes all remaining vertical space */
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            padding: 10px; /* Padding around the graph */
            box-sizing: border-box;
        }

        #moodDistributionChart {
            width: 100%;
            height: 100%;
            /* Chart.js will render into this canvas */
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="terminal-panel">
            <div class="panel-header">
                <span class="panel-header-title">Mood Distribution by Hour</span>
                <div class="panel-buttons"><span>_</span><span>□</span></div>
            </div>
            <div class="panel-content">
                <canvas id="moodDistributionChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        async function fetchAndRenderMoodDistribution() {
            try {
                const response = await fetch('/api/mood_distribution_by_hour');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const chartData = await response.json();

                const ctx = document.getElementById('moodDistributionChart').getContext('2d');

                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: chartData.labels,
                        datasets: chartData.datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                stacked: true,
                                title: {
                                    display: true,
                                    text: 'Hour of Day',
                                    color: '#33ff33'
                                },
                                ticks: {
                                    color: '#33ff33'
                                },
                                grid: {
                                    color: 'rgba(51, 255, 51, 0.2)'
                                }
                            },
                            y: {
                                stacked: true,
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Number of Mood Entries',
                                    color: '#33ff33'
                                },
                                ticks: {
                                    color: '#33ff33'
                                },
                                grid: {
                                    color: 'rgba(51, 255, 51, 0.2)'
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                labels: {
                                    color: '#33ff33'
                                }
                            },
                            title: {
                                display: true,
                                text: 'Mood Distribution Over Time of Day',
                                color: '#33ff33'
                            }
                        }
                    }
                });

            } catch (error) {
                console.error("Error fetching or rendering mood distribution:", error);
                const chartContainer = document.getElementById('moodDistributionChart').parentNode;
                chartContainer.innerHTML = '<p style="color: red; text-align: center; margin-top: 20%;">Failed to load mood distribution data. Please check the console for details.</p>';
            }
        }

        // Initial chart load
        document.addEventListener('DOMContentLoaded', fetchAndRenderMoodDistribution);
    </script>

</body>
</html>
