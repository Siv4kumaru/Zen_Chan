<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Over Time</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/sub_style.css">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            width: 100%;
            background-color: black;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            height: 100%;
        }
        .terminal-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .panel-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }
        #moodOverTimeChart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="terminal-panel">
            <div class="panel-header">
                <span class="panel-header-title">Avg time on days of week</span>
            </div>
            <div class="panel-content">
                <canvas id="moodOverTimeChart"></canvas>
            </div>
        </div>
    </div>
<script>
    async function fetchAndRenderChart() {
        try {
            const response = await fetch('/api/mood_weekly_avg');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const chartData = await response.json();

            const ctx = document.getElementById('moodOverTimeChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartData.labels,
                    datasets: [{
                        ...chartData.datasets[0],
                        backgroundColor: [
                            'rgba(51, 255, 51, 0.7)',   // neon green
                            'rgba(51, 153, 255, 0.7)',  // neon blue
                            'rgba(255, 51, 153, 0.7)',  // neon pink
                            'rgba(255, 204, 51, 0.7)',  // neon yellow
                            'rgba(153, 51, 255, 0.7)',  // neon purple
                            'rgba(255, 102, 51, 0.7)',  // neon orange
                            'rgba(0, 255, 204, 0.7)'    // neon cyan
                        ],
                        borderColor: [
                            'rgba(51, 255, 51, 1)',
                            'rgba(51, 153, 255, 1)',
                            'rgba(255, 51, 153, 1)',
                            'rgba(255, 204, 51, 1)',
                            'rgba(153, 51, 255, 1)',
                            'rgba(255, 102, 51, 1)',
                            'rgba(0, 255, 204, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            ticks: { color: '#33ff33' },
                            grid: { color: '#444' }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Avg Hours',
                                color: '#33ff33'
                            },
                            ticks: { color: '#33ff33' },
                            grid: { color: '#444' }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: { color: '#33ff33' }
                        }
                    }
                }
            });
        } catch (error) {
            console.error("Error fetching or rendering chart:", error);
        }
    }
    document.addEventListener('DOMContentLoaded', fetchAndRenderChart);
</script>

</body>
</html>
