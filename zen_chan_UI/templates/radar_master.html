<!-- templates/radar_graph.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Graph: Visit Durations</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="static/css/style.css">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      background-color: black;
    }
    .grid-container {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      height: 100%;
    }
    .terminal-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9em;
    }
    .panel-header-title {
      color: #33ff33;
    }
    .panel-buttons span {
      margin-left: 10px;
      cursor: pointer;
      color: #33ff33;
    }
    .panel-content {
      flex-grow: 1;
      display: flex;
      flex-direction: row;
      padding: 10px;
      gap: 10px;
    }
    .controls-panel {
      flex-shrink: 0;
      width: 170px;
      padding: 15px;
      border: 1px solid #33ff33;
      background-color: #000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-sizing: border-box;
    }
    .controls-panel select {
      background: black;
      color: #33ff33;
      border: 1px solid #33ff33;
      padding: 8px;
      width: 100%;
      box-sizing: border-box;
      font-family: 'Courier New', monospace;
      font-size: 1em;
    }
    .graphs-container {
      flex-grow: 1;
      display: flex;
      flex-direction: row;
      gap: 20px;
      justify-content: space-evenly;
      align-items: stretch;
    }
    .graph {
      flex: 1;
      min-width: 0;
      min-height: 0;
      padding: 8px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <div class="terminal-panel">
      <div class="panel-header">
        <span class="panel-header-title">Visit Radar Graphs</span>
        <div class="panel-buttons"><span>_</span><span>□</span></div>
      </div>
      <div class="panel-content">
        <!-- Controls Panel -->
        <div class="controls-panel" style="display:none;">
          <select id="timeFilter">
            <option value="today" selected>Today</option>
            <option value="this_week">This Week</option>
            <option value="this_month">This Month</option>
            <option value="this_year">This Year</option>
            <option value="last_year">Last Year</option>
            <option value="all_time">All Time</option>
          </select>
        </div>
        <!-- Two Graphs Side by Side -->
        <div class="graphs-container">
          <div class="graph">
            <canvas id="moodChart"></canvas>
          </div>
          <div class="graph">
            <canvas id="activityChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let moodChart = null;
    let activityChart = null;

    async function fetchAndRenderChart(chartType, canvasId, chartTitle) {
      const timeFilter = document.getElementById('timeFilter').value;
      const response = await fetch(`/api/radar_data?type=${chartType}&time_filter=${timeFilter}`);
      const chartData = await response.json();

      const ctx = document.getElementById(canvasId).getContext('2d');

      if (chartType === 'mood' && moodChart) {
        moodChart.destroy();
      }
      if (chartType === 'pre_labels' && activityChart) {
        activityChart.destroy();
      }

      if (!chartData.labels || chartData.labels.length === 0) {
        ctx.canvas.parentNode.innerHTML = `<p style="color:#888;text-align:center;">No data for ${chartTitle}</p>`;
        return;
      }

      let maxDataValue = 0;
      chartData.datasets.forEach(dataset => {
        dataset.data.forEach(value => {
          maxDataValue = Math.max(maxDataValue, value);
        });
      });
      let dynamicMax = Math.max(Math.ceil(maxDataValue * 1.1), 5);

      const newChart = new Chart(ctx, {
        type: 'radar',
        data: chartData,
        options: {
          responsive: true,
          maintainAspectRatio: false,
          elements: { line: { borderWidth: 5 }},
          scales: {
            r: {
              min: 0,
              max: dynamicMax,
              angleLines: { color: '#33ff33' },
              grid: { color: '#444' },
              pointLabels: { color: '#33ff33', font: { size: 12 }},
              ticks: {
                color: '#33ff33',
                backdropColor: "rgba(0,0,0,0)",
                callback: v => (v % 1 === 0 ? v : null)
              }
            }
          },
          plugins: {
            title: {
              display: true,
              text: chartTitle + ` (${timeFilter.replace('_',' ')})`,
              color: '#33ff33'
            },
            legend: { display: false }
          }
        }
      });

      if (chartType === 'mood') {
        moodChart = newChart;
      } else {
        activityChart = newChart;
      }
    }

    function refreshCharts() {
      fetchAndRenderChart('mood', 'moodChart', 'Mood');
      fetchAndRenderChart('pre_labels', 'activityChart', 'Activity');
    }

    document.getElementById('timeFilter').addEventListener('change', refreshCharts);
    document.addEventListener('DOMContentLoaded', refreshCharts);
  </script>
</body>
</html>
