<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen_Chan V.1.0.0.0</title>
    <!-- Assuming static/css/style.css exists, otherwise remove this line -->
    <!-- <link rel="stylesheet" href="static/css/style.css"> --> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/3.0.1/plotly.min.js" integrity="sha512-GvBV4yZL+5zT68skQaXRW80H+S82WupIppDunAVt6pCLVdFmTv9tstetOqXv76L/z9WFl+0zY28QFKu0LAVFSg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background-color: #0d0d0d;
            color: #33ff33;
            font-family: 'Courier New', monospace;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            height: 100%;
        }
        .terminal-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .panel-header {
            background: black;
            color: #33ff33;
            padding: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #33ff33;
        }
        .panel-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        select {
            background: black;
            color: #33ff33;
            border: 1px solid #33ff33;
            margin: 5px;
            padding: 5px;
        }
        #graph {
            flex-grow: 1;
        }
    </style>
</head>

<body>
<div class="grid-container">
    <div class="terminal-panel">
        <div class="panel-header">
            <span class="panel-header-title">Embedding</span>
            <div class="panel-buttons"><span>_</span><span>□</span></div>
        </div>
        <div class="panel-content">
            <div>
                <select id="timeFilter">
                    <option value="today">Today</option>
                    <option value="all">All Time</option>
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                    <option value="year">This Year</option>
                    <option value="2023">2023</option>
                    <option value="2024">2024</option>
                </select>

                <select id="dimFilter">
                    <option value="2d">2D</option>
                    <option value="3d">3D</option>
                </select>
            </div>

            <div id="graph"></div>
        </div>
    </div>
</div>

<script>
function loadGraph() {
    const time = $('#timeFilter').val();
    const dim = $('#dimFilter').val();

    $.get('/get_data_embeddings', { time: time, dim: dim }, function(data) {
        const traces = [];
        const groupedByMood = {};

        // 1. Group data points by pre_labels and accumulate duration
        data.forEach(d => {
            // Use 'Unknown Category' as a fallback if pre_labels is null or undefined
            const categoryKey = d.pre_labels || 'Unknown Category'; 
            
            if (!groupedByMood[categoryKey]) {
                groupedByMood[categoryKey] = {
                    points: [],
                    color: d.color, 
                    totalDuration: 0 
                };
            }
            groupedByMood[categoryKey].points.push(d);
            groupedByMood[categoryKey].totalDuration += (d.duration || 0); 
        });

        // NEW: Convert the groupedByMood object into an array for sorting
        const categoriesArray = Object.keys(groupedByMood).map(categoryName => ({
            name: categoryName,
            data: groupedByMood[categoryName]
        }));

        // NEW: Sort the categories by totalDuration in descending order
        categoriesArray.sort((a, b) => b.data.totalDuration - a.data.totalDuration);

        // 2. Create a separate trace for each category (pre_labels) in sorted order
        categoriesArray.forEach(categoryItem => {
            const category = categoryItem.name;
            const categoryData = categoryItem.data.points;
            const categoryColor = categoryItem.data.color; 
            const cumulativeDurationSeconds = categoryItem.data.totalDuration;
            const cumulativeDurationHours = (cumulativeDurationSeconds / 3600).toFixed(2); 

            const x = categoryData.map(d => d.x);
            const y = categoryData.map(d => d.y);
            const z = categoryData.map(d => d.z);
            const hoverLabels = categoryData.map(d => `Title: ${d.title}<br>Domain: ${d.domain}<br>Pre_label: ${d.pre_labels}`);

            let trace;
            if (dim === "2d") {
                trace = {
                    x: x,
                    y: y,
                    mode: 'markers',
                    type: 'scatter',
                    name: `${category} (${cumulativeDurationHours}h)`, 
                    text: hoverLabels,
                    hoverinfo: 'text',
                    marker: { color: categoryColor, size: 6 } 
                };
            } else { // 3d
                trace = {
                    x: x,
                    y: y,
                    z: z,
                    mode: 'markers',
                    type: 'scatter3d',
                    name: `${category} (${cumulativeDurationHours}h)`, 
                    text: hoverLabels,
                    hoverinfo: 'text',
                    marker: { color: categoryColor, size: 4 } 
                };
            }
            traces.push(trace);
        });

        // 3. Define the layout with legend styling
        const layout = {
            paper_bgcolor: '#0d0d0d',
            plot_bgcolor: '#0d0d0d',
            font: {
                color: '#33ff33', 
                family: 'Courier New, monospace'
            },
            legend: { 
                x: 1, 
                y: 1, 
                xanchor: 'right', 
                yanchor: 'top',   
                bgcolor: 'black',
                bordercolor: '#33ff33',
                borderwidth: 1,
                font: {
                    color: '#33ff33' 
                }
            },
            showlegend: true 
        };

        // Add 3D scene config if 3D
        if (dim === "3d") {
            layout.scene = {
                xaxis: { showbackground: false, gridcolor: '#1a1a1a', zerolinecolor: '#33ff33', showticklabels: false, title: '' },
                yaxis: { showbackground: false, gridcolor: '#1a1a1a', zerolinecolor: '#33ff33', showticklabels: false, title: '' },
                zaxis: { showbackground: false, gridcolor: '#1a1a1a', zerolinecolor: '#33ff33', showticklabels: false, title: '' }
            };
        }

        Plotly.newPlot('graph', traces, layout);
    });
}

// Trigger graph load on dropdown change
$('#timeFilter, #dimFilter').change(loadGraph);

// Load graph with default "today" filter and 3D dimension on page load
$(document).ready(function() {
    $('#timeFilter').val('today');
    $('#dimFilter').val('3d'); // Changed default dimension to 3D
    loadGraph();
});
</script>

</body>
</html>
