<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen_Chan Embeddings</title>
    <!-- Assuming static/css/style.css exists, otherwise remove this line -->
    <!-- <link rel="stylesheet" href="static/css/style.css"> -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/3.0.1/plotly.min.js" integrity="sha512-GvBV4yZL+5zT68skQaXRW80H+S82WupIppDunAVt6pCLVdFmTv9tstetOqXv76L/z9WFl+0zY28QFKu0LAVFSg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/sub_style.css">

</head>

<body>
<div class="grid-container">
    <div class="terminal-panel">
        <div class="panel-header">
            <span class="panel-header-title">Embedding</span>
            <div class="panel-buttons"><span>_</span><span>□</span></div>
        </div>
        <div class="panel-content">
            <div>
                <select id="timeFilter" style="display: none;">
                    <option value="today">Today</option>
                    <option value="all">All Time</option>
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                    <option value="year">This Year</option>
                    <option value="2023">2023</option>
                    <option value="2024">2024</option>
                </select>

                <select id="dimFilter">
                    <option value="2d">2D</option>
                    <option value="3d">3D</option>
                </select>
            </div>

            <div id="graph"></div>
        </div>
    </div>
</div>

<script>
function loadGraph() {
    const time = "all"; // hardcoded for now
    const dim = $('#dimFilter').val();

    $.get('/get_data_embeddings', { time: time, dim: dim }, function(data) {
        const traces = [];
        const groupedByMood = {};

        // 1. Group data points by pre_labels and accumulate duration
        data.forEach(d => {
            const categoryKey = d.pre_labels || 'Unknown Category';

            if (!groupedByMood[categoryKey]) {
                groupedByMood[categoryKey] = {
                    points: [],
                    color: d.color, // may be null/duplicate
                    totalDuration: 0
                };
            }
            groupedByMood[categoryKey].points.push(d);
            groupedByMood[categoryKey].totalDuration += (d.duration || 0);
        });

        // 2. Convert to array and sort
        const categoriesArray = Object.keys(groupedByMood).map(categoryName => ({
            name: categoryName,
            data: groupedByMood[categoryName]
        }));
        categoriesArray.sort((a, b) => b.data.totalDuration - a.data.totalDuration);

        // 3. Define a color palette
        const palette = [
            '#e6194b','#3cb44b','#ffe119','#4363d8','#f58231',
            '#911eb4','#46f0f0','#f032e6','#bcf60c','#fabebe',
            '#008080','#e6beff','#9a6324','#fffac8','#800000',
            '#aaffc3','#808000','#ffd8b1','#000075','#808080'
        ];
        let colorIndex = 0;
        const assignedColors = {};

        // 4. Create traces
        categoriesArray.forEach(categoryItem => {
            const category = categoryItem.name;
            const categoryData = categoryItem.data.points;
            let categoryColor = categoryItem.data.color;

            // If no color given or already used, assign from palette
            if (!categoryColor || Object.values(assignedColors).includes(categoryColor)) {
                categoryColor = palette[colorIndex % palette.length];
                colorIndex++;
            }
            assignedColors[category] = categoryColor;

            const cumulativeDurationSeconds = categoryItem.data.totalDuration;
            const cumulativeDurationHours = (cumulativeDurationSeconds / 3600).toFixed(2);

            const x = categoryData.map(d => d.x);
            const y = categoryData.map(d => d.y);
            const z = categoryData.map(d => d.z);
            const hoverLabels = categoryData.map(
                d => `Title: ${d.title}<br>Domain: ${d.domain}<br>Pre_label: ${d.pre_labels}`
            );

            let trace;
            if (dim === "2d") {
                trace = {
                    x: x,
                    y: y,
                    mode: 'markers',
                    type: 'scatter',
                    name: `${category} (${cumulativeDurationHours}h)`,
                    text: hoverLabels,
                    hoverinfo: 'text',
                    marker: { color: categoryColor, size: 10 }
                };
            } else {
                trace = {
                    x: x,
                    y: y,
                    z: z,
                    mode: 'markers',
                    type: 'scatter3d',
                    name: `${category} (${cumulativeDurationHours}h)`,
                    text: hoverLabels,
                    hoverinfo: 'text',
                    marker: { color: categoryColor, size: 8 }
                };
            }
            traces.push(trace);
        });

        // Layout (same as before)...
        const layout = {
            autosize: true,
            margin: { l: 0, r: 0, b: 0, t: 0 },
            paper_bgcolor: 'black',
            plot_bgcolor: 'black',
            font: { color: '#33ff33', family: 'Courier New, monospace' },
            legend: {
                x: 0, y: 0, xanchor: 'right', yanchor: 'bottom',
                bgcolor: 'black', bordercolor: '#33ff33', borderwidth: 1,
                font: { color: '#33ff33' }
            },
            showlegend: true
        };

        if (dim === "3d") {
            layout.scene = {
                xaxis: { showbackground: false, gridcolor: '#1a1a1a', zerolinecolor: '#33ff33', showticklabels: false, title: '' },
                yaxis: { showbackground: false, gridcolor: '#1a1a1a', zerolinecolor: '#33ff33', showticklabels: false, title: '' },
                zaxis: { showbackground: false, gridcolor: '#1a1a1a', zerolinecolor: '#33ff33', showticklabels: false, title: '' },
                camera: { zoom: 1.2 }
            };
        }

        Plotly.newPlot('graph', traces, layout);

        window.addEventListener('resize', function() {
            Plotly.relayout('graph', {
                'autosize': true,
                'height': $('#graph').height(),
                'width': $('#graph').width()
            });
        });
    });
}

// Trigger graph load on dropdown change
$('#timeFilter, #dimFilter').change(loadGraph);

// Load graph with default "today" filter and 3D dimension on page load
$(document).ready(function() {
    $('#timeFilter').val('today');
    $('#dimFilter').val('3d'); // Changed default dimension to 3D
    loadGraph();
});
</script>

</body>
</html>
