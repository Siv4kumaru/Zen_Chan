<!-- templates/mood_mapping.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Rules Mapping (ECharts)</title>
    <!-- ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="static/css/style.css">
    <style>    
        html, body {
            margin: 0;
            height: 100%;
            width: 100%;
            background-color: black; /* Pure black background */
            color: #33ff33;
            font-family: 'Courier New', monospace;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            height: 100%;
        }
        .terminal-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            border: 1px solid #33ff33; /* Add border for terminal effect */
            box-sizing: border-box; /* Include padding and border in the element's total width and height */
        }

        /* Terminal Panel Header Styles */
        .panel-header {
            background-color: #0a0a0a; /* Slightly lighter black for header */
            padding: 8px 15px;
            border-bottom: 1px solid #33ff33;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
            text-transform: uppercase;
        }
        .panel-header-title {
            color: #33ff33;
        }
        .panel-buttons span {
            margin-left: 10px;
            cursor: pointer;
            color: #33ff33;
        }

        /* Content area for the ECharts graph */
        .panel-content {
            flex-grow: 1; /* Takes all remaining vertical space */
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            padding: 10px; /* Padding around the graph */
            box-sizing: border-box;
        }

        #moodMappingGraph {
            width: 100%;
            height: 100%;
            /* ECharts will render into this div, it needs explicit dimensions */
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="terminal-panel">
            <div class="panel-header">
                <span class="panel-header-title">Mood Rules Mapping</span>
                <div class="panel-buttons"><span>_</span><span>□</span></div>
            </div>
            <div class="panel-content">
                <div id="moodMappingGraph">
                    <!-- ECharts graph will be rendered here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let myChart = null; // To hold the ECharts instance

        // Store original data for reset and filtering
        let originalEchartsNodes = [];
        let originalEchartsLinks = [];
        
        // Color definitions
        const COLOR_PALETTES = {
            'pre_label': "rgba(51, 255, 51, 1.0)",     // Bright Green
            'time_of_day': "rgba(255, 255, 51, 1.0)", // Bright Yellow
            'mood': "rgba(0, 255, 255, 1.0)"          // Bright Cyan
        };
        const LINK_ALPHA = 0.4; // Transparency for active links
        const FADE_ALPHA_NODE = 0.1; // Transparency for faded nodes
        const FADE_ALPHA_LINK = 0.05; // Transparency for faded links
        const FADE_COLOR_BASE = "128, 128, 128"; // RGB parts for faded grey

        async function fetchAndRenderMoodMapping() {
            try {
                const response = await fetch('/api/mood_mapping_data');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const rawData = await response.json(); 

                const graphDiv = document.getElementById('moodMappingGraph');

                // Clear previous chart if exists and dispose ECharts instance
                if (myChart) {
                    myChart.dispose();
                    myChart = null;
                }
                graphDiv.innerHTML = ''; // Clear div content

                // --- Data Processing for ECharts ---

                // ECharts Sankey nodes and links use string names directly
                // We'll create a list of all unique node names (labels) and their initial colors
                // And a list of links with source/target names and values

                const allNodeNames = new Set();
                rawData.pre_labels.forEach(name => allNodeNames.add(name));
                rawData.time_of_day_labels.forEach(name => allNodeNames.add(name));
                rawData.mood_labels.forEach(name => allNodeNames.add(name));

                if (allNodeNames.size === 0) {
                    graphDiv.innerHTML = '<p style="color: #888; text-align: center; margin-top: 20%;">No data available to create the mapping.</p>';
                    return;
                }
                
                // Prepare ECharts nodes data with their initial colors
                originalEchartsNodes = Array.from(allNodeNames).map(name => {
                    let color;
                    if (rawData.pre_labels.includes(name)) {
                        color = COLOR_PALETTES['pre_label'];
                    } else if (rawData.time_of_day_labels.includes(name)) {
                        color = COLOR_PALETTES['time_of_day'];
                    } else if (rawData.mood_labels.includes(name)) {
                        color = COLOR_PALETTES['mood'];
                    } else {
                        color = "rgba(128, 128, 128, 1.0)"; // Default grey
                    }
                    return {
                        name: name,
                        itemStyle: {
                            color: color // Node fill color
                        }
                    };
                });

                // Prepare ECharts links data with source/target names, values, and initial colors
                originalEchartsLinks = rawData.links.map(link => {
                    let sourceColor = "rgba(128, 128, 128, 1.0)"; // Default grey for links
                    if (rawData.pre_labels.includes(link.source)) {
                        sourceColor = COLOR_PALETTES['pre_label'];
                    } else if (rawData.time_of_day_labels.includes(link.source)) {
                        sourceColor = COLOR_PALETTES['time_of_day'];
                    } else if (rawData.mood_labels.includes(link.source)) {
                        sourceColor = COLOR_PALETTES['mood'];
                    }
                    return {
                        source: link.source,
                        target: link.target,
                        value: link.value,
                        lineStyle: {
                            color: sourceColor.replace("1.0)", `${LINK_ALPHA})`), // Link color with transparency
                            curveness: 0.5 // Default curveness for Sankey links
                        }
                    };
                });
                
                // --- ECharts Option Configuration ---
                const option = {
                    backgroundColor: 'black', // Overall chart background
                    title: {
                        text: "Mood Rules Mapping:<br>Pre-Label → Time of Day → Mood",
                        left: 'center',
                        top: 20,
                        textStyle: {
                            color: '#33ff33',
                            fontFamily: 'Courier New, monospace',
                            fontSize: 24
                        }
                    },
                    tooltip: {
                        trigger: 'item',
                        triggerOn: 'mousemove', // Show tooltip on mouse move
                        formatter: function(params) {
                            if (params.dataType === 'node') {
                                // For nodes, show its name
                                return `Node: <b>${params.name}</b>`;
                            } else if (params.dataType === 'link') {
                                // For links, show source -> target and value
                                return `Flow: <b>${params.data.source} → ${params.data.target}</b><br/>Value: <b>${params.data.value}</b>`;
                            }
                            return '';
                        },
                        textStyle: {
                            color: '#33ff33',
                            fontFamily: 'Courier New, monospace'
                        },
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        borderColor: '#33ff33',
                        borderWidth: 1
                    },
                    series: [{
                        type: 'sankey',
                        layout: 'none', // Use default layout, or 'none' for automatic
                        data: originalEchartsNodes, // Initial nodes data
                        links: originalEchartsLinks, // Initial links data
                        nodeWidth: 20, // Node thickness
                        nodeGap: 15,  // Node padding
                        label: {
                            color: '#33ff33', // Node label color
                            fontFamily: 'Courier New, monospace',
                            fontSize: 12,
                            position: 'right' // Label position
                        },
                        itemStyle: {
                            borderColor: '#33ff33', // Node border color
                            borderWidth: 0.5
                        },
                        lineStyle: {
                            opacity: LINK_ALPHA, // Default link opacity
                            curveness: 0.5,
                            color: 'source' // Links inherit source node's color by default, if not explicitly set
                        }
                    }]
                };

                // Initialize ECharts instance
                myChart = echarts.init(graphDiv);
                myChart.setOption(option);

                // Add resize listener for responsiveness
                window.addEventListener('resize', () => {
                    if (myChart) {
                        myChart.resize();
                    }
                });

                // Add click listener for interaction
                myChart.on('click', function(params) {
                    if (params.dataType === 'node') {
                        const clickedNodeName = params.name;
                        applyNodeFilter(clickedNodeName, rawData.pre_labels, rawData.time_of_day_labels, rawData.mood_labels);
                    } else {
                        // Clicking on a link or empty space resets the view
                        resetGraphView();
                    }
                });

                // Clicking on the chart background (not a node/link) to reset
                myChart.getZr().on('click', function (params) {
                    // Check if the click target is the chart background itself (not a graphical element)
                    if (params.target === undefined || params.target.dataIndex === undefined) {
                        resetGraphView();
                    }
                });


            } catch (error) {
                console.error("Error fetching or rendering mood mapping:", error);
                const graphDiv = document.getElementById('moodMappingGraph');
                graphDiv.innerHTML = '<p style="color: red; text-align: center; margin-top: 20%;">Failed to load mapping data. Please check the console for details.</p>';
            }
        }

        // Helper to convert RGBA string to an RGB string for fading
        function getRGBFromRGBA(rgbaString) {
            const parts = rgbaString.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*(\d*\.?\d+))?\)/);
            if (parts && parts.length >= 4) {
                return `${parts[1]}, ${parts[2]}, ${parts[3]}`;
            }
            return FADE_COLOR_BASE; // Fallback
        }


        // Function to apply the node filter: Show only immediate parents and children
        function applyNodeFilter(clickedNodeName, preLabels, timeOfDayLabels, moodLabels) {
            // Deep copy current node and link data to modify
            const currentNodesData = JSON.parse(JSON.stringify(originalEchartsNodes));
            const currentLinksData = JSON.parse(JSON.stringify(originalEchartsLinks));

            const nodesToHighlight = new Set();
            const linksToHighlight = new Set();

            // 1. Always highlight the clicked node itself
            nodesToHighlight.add(clickedNodeName);

            // 2. Find and highlight immediate children and their connecting links
            currentLinksData.forEach((link, idx) => {
                if (link.source === clickedNodeName) {
                    nodesToHighlight.add(link.target); // Add child node's name
                    linksToHighlight.add(idx); // Add connecting link's index
                }
            });

            // 3. Find and highlight immediate parents and their connecting links
            currentLinksData.forEach((link, idx) => {
                if (link.target === clickedNodeName) {
                    nodesToHighlight.add(link.source); // Add parent node's name
                    linksToHighlight.add(idx); // Add connecting link's index
                }
            });

            // Apply colors to nodes: fade if not in nodesToHighlight
            currentNodesData.forEach(node => {
                if (!nodesToHighlight.has(node.name)) {
                    // Fade color
                    const originalRGB = getRGBFromRGBA(node.itemStyle.color);
                    node.itemStyle.color = `rgba(${originalRGB}, ${FADE_ALPHA_NODE})`;
                }
                // If it IS in nodesToHighlight, its original color remains
            });

            // Apply colors to links: fade if not in linksToHighlight
            currentLinksData.forEach((link, idx) => {
                if (!linksToHighlight.has(idx)) {
                    // Fade color
                    const originalRGB = getRGBFromRGBA(link.lineStyle.color);
                    link.lineStyle.color = `rgba(${originalRGB}, ${FADE_ALPHA_LINK})`;
                }
                // If it IS in linksToHighlight, its original color remains
            });

            // Update ECharts with the new option
            myChart.setOption({
                series: [{
                    data: currentNodesData,
                    links: currentLinksData
                }]
            });
        }

        // Function to reset the graph view to full visibility
        function resetGraphView() {
            myChart.setOption({
                series: [{
                    data: originalEchartsNodes,
                    links: originalEchartsLinks
                }]
            });
        }

        // Initial graph load
        document.addEventListener('DOMContentLoaded', fetchAndRenderMoodMapping);
    </script>

</body>
</html>
