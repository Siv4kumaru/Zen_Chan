<!-- templates/radar_graph.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Graph: Visit Durations</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="static/css/style.css">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            width: 100%;
            background-color: black; /* Pure black background */

        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            height: 100%;
        }
        
        /* Terminal Panel specific styles (added for completeness from previous responses) */
        .terminal-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }
        .panel-header-title {
            color: #33ff33;
        }
        .panel-buttons span {
            margin-left: 10px; /* Added margin for consistency */
            cursor: pointer;
            color: #33ff33;
        }

        /* NEW: Flex container for controls and graph */
        .panel-content {
            flex-grow: 1; /* Takes all remaining vertical space */
            display: flex; /* Make it a flex container */
            flex-direction: row; /* Arrange children in a row */
            padding: 10px; /* Padding for the entire content area */
            gap: 10px; /* Space between the controls panel and the graph */
        }

        /* NEW: Styles for the controls sidebar */
        .controls-panel {
            flex-shrink: 0; /* Prevent it from shrinking */
            width: 170px; /* Fixed width for the controls panel */
            min-width: 100px; /* Minimum width to ensure readability on smaller screens */
            max-width: 250px; /* Maximum width to prevent it from getting too wide */
            padding: 15px; /* Internal padding */
            border: 1px solid #33ff33; /* Match terminal theme */
            background-color: #000; /* Match terminal theme */
            display: flex; /* To stack select elements */
            flex-direction: column; /* Stack select elements vertically */
            gap: 10px; /* Space between dropdowns */
            box-sizing: border-box; /* Include padding and border in the element's total width and height */
        }

        /* Adjust select styles for consistency within the new panel */
        .controls-panel select {
            background: black;
            color: #33ff33;
            border: 1px solid #33ff33;
            padding: 8px; /* Slightly more padding */
            width: 100%; /* Make selects fill the control panel width */
            box-sizing: border-box; /* Include padding and border in width */
            margin: 0; /* Remove default margin that could interfere with gap */
            font-family: 'Courier New', monospace; /* Inherit terminal font */
            font-size: 1em;
        }

        /* Graph container */
        #graph {
            flex-grow: 1; /* Changed from 0 to 1: graph takes up all available remaining horizontal space */
            flex-shrink: 1; /* Allow it to shrink if window is very narrow */
            min-width: 0; /* Crucial for flex items to shrink horizontally below their content size */
            min-height: 0; /* NEW: Crucial for allowing flex items to shrink vertically */
            height: 125%;
            padding: 10px; /* Padding inside the graph div */
            box-sizing: border-box; /* Include padding and border in the element's total width and height */
            
            display: flex; /* Use flex to center the canvas if needed, or just for robustness */
            justify-content: center;
            align-items: center;
        }
        
        /* Ensure canvas fully fills its parent (which is #graph) */
        #radarChart {
            width: 100%;
            height: 100%;
            display: block; /* Remove extra space below canvas if it's treated as inline */
        }
    </style>
</head>
<body>

    <div class="grid-container">
    <div class="terminal-panel">
        <div class="panel-header">
            <span class="panel-header-title">Visit Radar Graph</span>
            <div class="panel-buttons"><span>_</span><span>□</span></div>
        </div>
        <div class="panel-content">
            <!-- Controls Panel (Sidebar) -->
            <div class="controls-panel">
                <select id="timeFilter">
                    <option value="today" selected>Today</option>
                    <option value="this_week">This Week</option>
                    <option value="this_month">This Month</option>
                    <option value="this_year">This Year</option>
                    <option value="last_year">Last Year</option>
                    <option value="all_time">All Time</option>
                </select>
<!-- 
                <select id="dimFilter">
                    <option value="mood" selected>Mood</option>
                    <option value="pre_labels">Activity</option>
                </select> -->
            </div>

            

        </div>
    </div>
    </div>
    <script>

    </script>

</body>
</html>
