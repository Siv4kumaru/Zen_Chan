<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Choose Chrome Profile</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="static/css/style.css">
  <style>
    body {
      background-color: #111;
      color: #c8facc;
      font-family: "Courier New", monospace;
    }
    h2 {
      border-bottom: 1px solid #6cff6c;
      padding-bottom: 10px;
      margin-bottom: 30px;
      color: #aefcae;
    }
    .card {
      background-color: #1a1a1a;
      border: 1px solid #6cff6c;
      box-shadow: 0 0 8px rgba(108, 255, 108, 0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: scale(1.03);
      box-shadow: 0 0 15px rgba(108, 255, 108, 0.35);
    }
    .card-title {
      color: #c8facc;
    }
    .btn-light {
      background-color: transparent;
      color: #aefcae;
      border: 1px solid #6cff6c;
      font-family: "Courier New", monospace;
      transition: all 0.2s ease;
    }
    .btn-light:hover {
      background-color: #6cff6c;
      color: #000;
      transform: scale(1.05);
    }
    .card-img-top {
      border: 1px solid #6cff6c;
      border-radius: 50%;
      background-color: #222;
    }

    /* Terminal-style modal */
    .modal-content {
      background-color: #111;
      border: 1px solid #6cff6c;
      color: #aefcae;
      font-family: "Courier New", monospace;
      padding: 10px;
    }
    .terminal-output {
      background: #000;
      padding: 10px;
      height: 200px;
      overflow-y: auto;
      border: 1px solid #6cff6c;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .progress {
      height: 10px;
      background-color: #222;
      border: 1px solid #6cff6c;
    }
    .progress-bar {
      background-color: #6cff6c;
    }
  </style>
</head>

<body>

<div class="container py-5">
    
  <h2 class="mb-4">[ Select a Chrome Profile ]</h2>
  <div class="row">
    {% for profile in profiles %}
    <div class="col-md-3 mb-4">
      <div class="card text-center">
        <img src="{{ profile.avatar }}" class="card-img-top" alt="avatar"
             style="width:100px; margin:auto; padding:10px;">
        <div class="card-body">
          <h5 class="card-title">{{ profile.name }}</h5>
          <button class="btn btn-light" onclick="runProcess('{{ profile.id }}', '{{ profile.name }}')">> Select</button>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="processModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <h5>> Running process...</h5>
      <div class="terminal-output" id="terminal"></div>
      <div class="progress">
        <div class="progress-bar" id="progressBar" role="progressbar" style="width:0%"></div>
      </div>
    </div>
  </div>
</div>

<script>
    function runProcess(profileId, profileName) {
  let modal = new bootstrap.Modal(document.getElementById('processModal'));
  modal.show();
  
  let terminal = document.getElementById("terminal");
  terminal.innerHTML = ""; // clear old logs
  let progressBar = document.getElementById("progressBar");
  
  // Open SSE connection
  const eventSource = new EventSource(`/api/load_profile/${profileId}/${profileName}`);
  
  let step = 0;
  const stepsCount = 7; // adjust to match backend steps
  
  eventSource.onmessage = function(event) {
      terminal.innerHTML += event.data + "<br>";
      terminal.scrollTop = terminal.scrollHeight;

    step++;
    progressBar.style.width = (step / stepsCount * 100) + "%";
  };
  
  eventSource.onerror = function() {
      eventSource.close();
      setTimeout(() => {
          window.location.href = "/choose_profile";
        }, 1000);
    };
}

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
